log:
  level: info
routes:
  - path: /users
    methods:
      - POST
    stripPrefix: true
    backends:
      - http://im1:3001
      - http://im2:3002
      - http://im3:3003
  - path: /contacts
    methods:
      - GET
    stripPrefix: false
    backends:
      - http://im4:3004
      - http://im5:3005
      - http://im6:3006
limiter-conf:
  enabled: true
  shards: 32
  # k6/load-test.js runs 50 VUs with sleep(0.05), so the upper-bound demand is
  # about 50 / 0.05 = 1000 req/s before request latency. A 350-token burst and
  # 350 req/s refill target roughly 35% pass-through after the initial burst,
  # making rate-limit-on runs partially throttled instead of nearly all 429s.
  capacity: 350
  refillRate: 350
  ttl: 2m
  cleanUpTime: 1m
breaker-conf:
  enabled: true
  failureThreshold: 3
  successThreshold: 3
  cooldown: 10s
  slowThreshold: 3s
